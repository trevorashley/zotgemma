[project]
name = "zotgemma"
version = "0.1.0"
description = "A better Zotero search that leverages EmbeddingGemma 2."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Trevor Ashley", email = "trevor.ashley@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "torch",
    "sentence-transformers",
    "sqlite-vec",
    "numpy",
    "typer",
    "rich",
    "httpx",
    "pyyaml",
    "pillow>=12.3.0",
    "torchvision>=0.29.1",
]

[project.scripts]
zotgemma = "zotgemma.cli:app"
zotgemma-mcp = "zotgemma.mcp_server:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "zotgemma"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
